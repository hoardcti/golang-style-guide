# Add this entry to the `updates:` list in .github/dependabot.yml (GO-MOD-009).
# It also keeps the tool directives (golangci-lint, govulncheck, ...) up to date.

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
