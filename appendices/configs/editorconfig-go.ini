# Go section of the hoardCTI .editorconfig (GO-EDT-004).
# The hoardCTI template's .editorconfig already contains most of this; make
# sure these sections are present.

[*]
charset = utf-8
end_of_line = lf
insert_final_newline = true
trim_trailing_whitespace = true
max_line_length = 100

[*.go]
indent_style = tab
indent_size = 4

[{go.mod,go.sum}]
indent_style = tab

[Makefile]
indent_style = tab

[*.{yml,yaml,json}]
indent_style = space
indent_size = 2

[testdata/**]
# Fixtures are kept byte-for-byte as the upstream sent them.
trim_trailing_whitespace = unset
insert_final_newline = unset
end_of_line = unset
